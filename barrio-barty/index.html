<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- /barrio-barty/ not "./": vite emits one index.html PER ROUTE, so a relative
         href resolved against /barty/ and /play/ and asked for
         barty/barty/logo_b.svg — a 404 on every page of the deployed site. -->
    <!-- The train-dot gag (components/barty/secretQr.ts): /play?c=RKRL goes
         straight to the video, before anything of the app draws. RKRL is
         never a real room (no L in bartySync's CODE_ALPHABET). -->
    <script>
      try {
        if (/\/play\/?$/.test(location.pathname)
            && (new URLSearchParams(location.search).get('c') || '').toUpperCase() === 'RKRL') {
          location.replace('https://www.youtube.com/watch?v=xvFZjo5PgG0')
        }
      } catch (e) { /* no gag, the page loads as usual */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/barrio-barty/barty/logo_b.svg" />
    <title>Barrio BART-y</title>

      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=UnifrakturMaguntia&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/barrio-barty/assets/index-IET4WQA4.js"></script>
    <link rel="stylesheet" crossorigin href="/barrio-barty/assets/index-D7wL2kzh.css">
  </head>
