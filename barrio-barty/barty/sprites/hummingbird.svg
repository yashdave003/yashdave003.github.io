<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Anna's hummingbird team token">
  <!-- green body and tail -->
  <g fill="#1f7a3d" stroke="#1f7a3d" stroke-width="1" stroke-linejoin="round">
    <path d="M 74 78 L 102 100 L 86 104 L 66 86 Z"/>
    <circle cx="62" cy="66" r="22"/>
    <path d="M 36 40 L 54 36 L 70 60 L 44 66 Z"/>
  </g>
  <!-- wing, swept up in a blur -->
  <path d="M 56 54 A 32 32 0 0 1 100 26 A 36 36 0 0 1 56 54 Z" fill="#549dbf" stroke="#549dbf" stroke-width="1" stroke-linejoin="round"/>
  <!-- magenta head and gorget -->
  <g fill="#D4537E" stroke="#D4537E" stroke-width="1" stroke-linejoin="round">
    <circle cx="44" cy="44" r="15"/>
    <path d="M 36 54 L 56 50 L 60 66 L 46 68 Z"/>
  </g>
  <!-- the needle bill -->
  <rect x="2" y="40" width="30" height="3.4" rx="1.7" fill="#2b2015" transform="rotate(4 17 42)"/>
  <!-- eye -->
  <circle cx="42" cy="40" r="4.4" fill="#f4ead8"/>
  <circle cx="41" cy="40" r="2.2" fill="#2b2015"/>
  <!-- tiny feet tucked up -->
  <g fill="#2b2015"><rect x="58" y="84" width="3" height="8" rx="1.5"/><rect x="65" y="86" width="3" height="8" rx="1.5"/></g>
</svg>
