<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Golden bear team token, a grinning mascot in a navy sweater">
  <!-- navy sweater body, arms up in a cheer -->
  <g fill="#004988" stroke="#004988" stroke-width="1" stroke-linejoin="round">
    <circle cx="60" cy="96" r="24"/>
    <rect x="16" y="66" width="16" height="30" rx="8" transform="rotate(-28 24 81)"/>
    <rect x="88" y="66" width="16" height="30" rx="8" transform="rotate(28 96 81)"/>
  </g>
  <!-- gold sweater stripe -->
  <path d="M 38 88 L 82 88" stroke="#EF9F27" stroke-width="5" stroke-linecap="round"/>
  <!-- golden paws -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1"><circle cx="16" cy="64" r="7"/><circle cx="104" cy="64" r="7"/></g>
  <!-- big golden head + ears -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round">
    <circle cx="34" cy="20" r="11"/>
    <circle cx="86" cy="20" r="11"/>
    <circle cx="60" cy="46" r="31"/>
  </g>
  <circle cx="34" cy="20" r="5.5" fill="#2b2015"/>
  <circle cx="86" cy="20" r="5.5" fill="#2b2015"/>
  <!-- wide mascot eyes -->
  <circle cx="47" cy="38" r="7.5" fill="#f4ead8"/>
  <circle cx="73" cy="38" r="7.5" fill="#f4ead8"/>
  <circle cx="48" cy="39" r="3.8" fill="#2b2015"/>
  <circle cx="72" cy="39" r="3.8" fill="#2b2015"/>
  <!-- parchment muzzle, nose, grin -->
  <ellipse cx="60" cy="58" rx="15" ry="11" fill="#f4ead8"/>
  <ellipse cx="60" cy="52" rx="5.5" ry="4" fill="#2b2015"/>
  <path d="M 51 60 Q 60 69 69 60" fill="none" stroke="#2b2015" stroke-width="2.6" stroke-linecap="round"/>
</svg>
