  </g>
  <line x1="80" y1="76" x2="92" y2="26" stroke="#2b2015" stroke-width="8" stroke-linecap="round"/>
  <line x1="82" y1="26" x2="102" y2="22" stroke="#2b2015" stroke-width="8" stroke-linecap="round"/>
  <rect x="18" y="76" width="72" height="11" rx="5.5" fill="#8cc63f" stroke="#2b2015" stroke-width="4"/>
  <circle cx="24" cy="96" r="12" fill="#2b2015"/>
  <circle cx="24" cy="96" r="4.5" fill="#d9d2c3"/>
  <circle cx="88" cy="96" r="12" fill="#2b2015"/>
