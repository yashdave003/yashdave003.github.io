<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="BART rat team token, holding a Clipper card">
  <!-- magenta tail, slung out behind -->
  <path d="M 94 88 Q 118 80 110 110" fill="none" stroke="#D4537E" stroke-width="5" stroke-linecap="round"/>
  <!-- grey body and pointed head -->
  <g fill="#549dbf" stroke="#549dbf" stroke-width="1" stroke-linejoin="round">
    <circle cx="70" cy="80" r="26"/>
    <path d="M 22 60 L 4 72 L 24 80 Z"/>
    <circle cx="38" cy="66" r="19"/>
    <circle cx="30" cy="44" r="9"/>
    <circle cx="48" cy="42" r="9"/>
    <!-- feet -->
    <rect x="54" y="100" width="10" height="7" rx="3.5"/>
    <rect x="78" y="100" width="10" height="7" rx="3.5"/>
  </g>
  <!-- ear insides -->
  <g fill="#D4537E"><circle cx="30" cy="44" r="4.5"/><circle cx="48" cy="42" r="4.5"/></g>
  <!-- eye, nose, whiskers -->
  <circle cx="30" cy="62" r="3.4" fill="#2b2015"/>
  <circle cx="6" cy="72" r="3.2" fill="#D4537E"/>
  <g fill="none" stroke="#2b2015" stroke-width="1.4" stroke-linecap="round">
    <path d="M 14 66 L 2 60 M 12 72 L 0 74 M 14 78 L 4 84"/>
  </g>
  <!-- the Clipper card, held in both paws -->
  <rect x="50" y="82" width="20" height="13" rx="2" fill="#0099D8" stroke="#0099D8" stroke-width="1"/>
  <rect x="50" y="86" width="20" height="3" fill="#f4ead8"/>
  <g fill="#2b2015"><circle cx="50" cy="88" r="4"/><circle cx="70" cy="88" r="4"/></g>
</svg>
