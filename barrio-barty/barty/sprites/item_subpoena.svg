  <path d="M80 10 V28 H98" fill="#e2d3b4" stroke="#2b2015" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#2b2015" stroke-width="5" stroke-linecap="round">
    <line x1="34" y1="32" x2="66" y2="32"/>
    <line x1="34" y1="48" x2="84" y2="48"/>
    <line x1="34" y1="62" x2="72" y2="62"/>
  </g>
  <path d="M32 94 Q37 82 41 93 T51 92" fill="none" stroke="#2b2015" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="88" r="20" fill="#b23a2e" stroke="#2b2015" stroke-width="5"/>
  <rect x="68" y="74" width="16" height="15" fill="#2b2015"/>
