<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Peptides: adds five travel minutes on a turn you choose">
  <!-- A clock (added minutes) with a teal plus badge — the positive twin of
       delay.svg's red-banned clock. -->
  <circle cx="55" cy="58" r="40" fill="#f4ead8" stroke="#2b2015" stroke-width="6"/>
  <g fill="#2b2015">
    <rect x="51" y="20" width="8" height="9" rx="2"/>
    <rect x="16" y="54" width="9" height="8" rx="2"/>
  </g>
  <line x1="55" y1="58" x2="55" y2="34" stroke="#2b2015" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="58" x2="72" y2="58" stroke="#2b2015" stroke-width="5" stroke-linecap="round"/>
  <circle cx="86" cy="86" r="22" fill="#2f8f7f" stroke="#2b2015" stroke-width="6"/>
  <rect x="76" y="82" width="20" height="8" rx="3" fill="#f4ead8"/>
  <rect x="82" y="76" width="8" height="20" rx="3" fill="#f4ead8"/>
</svg>
