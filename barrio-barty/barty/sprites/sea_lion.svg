<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sea lion team token">
  <!-- amber body: rear circle + chest circle + head circle + neck quad + fins -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round">
    <!-- tail fin, angled rounded stem with a circle flare -->
    <rect x="88" y="52" width="12" height="36" rx="6" transform="rotate(35 94 86)"/>
    <circle cx="110" cy="63" r="8.5"/>
    <!-- rear body -->
    <circle cx="72" cy="86" r="26"/>
    <!-- raised flipper (waving), rounded stem above the back -->
    <rect x="52" y="34" width="11" height="38" rx="5.5" transform="rotate(28 58 68)"/>
    <!-- chest -->
    <circle cx="46" cy="80" r="22"/>
    <!-- neck connector -->
    <path d="M 26 46 L 50 40 L 66 80 L 30 88 Z"/>
    <!-- head -->
    <circle cx="38" cy="42" r="17"/>
    <!-- resting front flipper, upper half-disc on the ground -->
    <path d="M 20 104 A 12 12 0 0 1 44 104 Z"/>
  </g>
  <!-- parchment muzzle -->
  <g fill="#f4ead8" stroke="#f4ead8" stroke-width="1">
    <circle cx="26" cy="47" r="8.5"/>
  </g>
  <!-- espresso details -->
  <g fill="#2b2015">
    <circle cx="20" cy="41" r="3.4"/>
    <circle cx="37" cy="35" r="3.6"/>
  </g>
  <g fill="none" stroke="#2b2015" stroke-width="1.6" stroke-linecap="round">
    <path d="M 19 46 L 6 43"/>
    <path d="M 20 49 L 7 50"/>
    <path d="M 19 52 L 8 56"/>
  </g>
</svg>
