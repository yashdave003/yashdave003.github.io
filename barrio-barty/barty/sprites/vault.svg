<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Alcatraz vault">
  <!-- espresso safe body -->
  <g fill="#2b2015" stroke="#2b2015" stroke-width="1" stroke-linejoin="round">
    <rect x="16" y="14" width="88" height="88" rx="14"/>
    <rect x="26" y="100" width="16" height="8" rx="3"/>
    <rect x="78" y="100" width="16" height="8" rx="3"/>
  </g>
  <!-- parchment door face (keeps the body legible on dark surfaces) -->
  <circle cx="60" cy="58" r="27" fill="#f4ead8" stroke="#f4ead8" stroke-width="1"/>
  <!-- amber door ring: evenodd annulus, same construction as the logo counters -->
  <path d="M 30 58 a 30 30 0 1 0 60 0 a 30 30 0 1 0 -60 0 M 36 58 a 24 24 0 1 0 48 0 a 24 24 0 1 0 -48 0"
        fill="#EF9F27" fill-rule="evenodd" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round"/>
  <!-- espresso wheel handle: hub + four spokes -->
  <g fill="#2b2015" stroke="#2b2015" stroke-width="1" stroke-linejoin="round">
    <rect x="57.5" y="36" width="5" height="44" rx="2.5"/>
    <rect x="38" y="55.5" width="44" height="5" rx="2.5"/>
    <circle cx="60" cy="58" r="9"/>
  </g>
  <!-- amber keyhole on the hub -->
  <circle cx="60" cy="55.5" r="3" fill="#EF9F27"/>
  <rect x="58.4" y="56" width="3.2" height="6.5" fill="#EF9F27"/>
  <!-- parchment rivets -->
  <g fill="#f4ead8">
    <circle cx="27" cy="25" r="3"/>
    <circle cx="93" cy="25" r="3"/>
    <circle cx="27" cy="91" r="3"/>
    <circle cx="93" cy="91" r="3"/>
  </g>
</svg>
