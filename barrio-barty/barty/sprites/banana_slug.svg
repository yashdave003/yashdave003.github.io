<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Banana slug team token">
  <!-- amber body: a low foot with the mantle hump and the head lifted -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round">
    <rect x="8" y="80" width="106" height="22" rx="11"/>
    <circle cx="58" cy="78" r="20"/>
    <circle cx="86" cy="84" r="14"/>
    <circle cx="28" cy="74" r="17"/>
    <!-- eye stalks -->
    <rect x="17" y="46" width="5" height="26" rx="2.5" transform="rotate(-18 19.5 59)"/>
    <rect x="30" y="44" width="5" height="28" rx="2.5" transform="rotate(12 32.5 58)"/>
  </g>
  <!-- stalk tips -->
  <g fill="#2b2015"><circle cx="15" cy="44" r="3.6"/><circle cx="35" cy="42" r="3.6"/></g>
  <!-- the breathing hole on the mantle, and a few spots -->
  <circle cx="64" cy="70" r="3" fill="#2b2015"/>
  <g fill="#2b2015" opacity=".8">
    <circle cx="50" cy="86" r="1.8"/><circle cx="72" cy="90" r="1.8"/><circle cx="92" cy="92" r="1.6"/><circle cx="40" cy="94" r="1.4"/>
  </g>
  <!-- content little mouth -->
  <path d="M 20 82 A 5 5 0 0 0 28 82" fill="none" stroke="#2b2015" stroke-width="2.4" stroke-linecap="round"/>
  <!-- slime trail -->
  <path d="M 4 106 Q 30 110 60 106 T 116 106" fill="none" stroke="#f4ead8" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
</svg>
