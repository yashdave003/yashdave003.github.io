<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Cherry-headed conure team token">
  <!-- espresso wire perch -->
  <g fill="#2b2015" stroke="#2b2015" stroke-width="1">
    <rect x="16" y="106" width="88" height="4" rx="2"/>
    <rect x="54" y="94" width="5" height="14" rx="2"/>
    <rect x="68" y="94" width="5" height="14" rx="2"/>
  </g>
  <!-- green body + tail -->
  <g fill="#1f7a3d" stroke="#1f7a3d" stroke-width="1" stroke-linejoin="round">
    <rect x="78" y="80" width="13" height="36" rx="6" transform="rotate(-38 84 84)"/>
    <circle cx="62" cy="70" r="27"/>
    <!-- folded wing, arc lens -->
    <path d="M 52 62 A 30 30 0 0 1 88 78 A 38 38 0 0 1 52 62 Z"/>
  </g>
  <!-- red head -->
  <g fill="#d40843" stroke="#d40843" stroke-width="1" stroke-linejoin="round">
    <circle cx="42" cy="38" r="17"/>
    <path d="M 34 50 L 56 44 L 62 62 L 42 66 Z"/>
  </g>
  <!-- amber beak: hooked upper mandible, quarter-disc -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round">
    <path d="M 30 30 A 13 13 0 0 0 18 47 L 31 41 Z"/>
  </g>
  <!-- parchment eye ring + espresso pupil -->
  <circle cx="38" cy="35" r="5.5" fill="#f4ead8" stroke="#f4ead8" stroke-width="1"/>
  <circle cx="37" cy="35" r="2.6" fill="#2b2015"/>
</svg>
