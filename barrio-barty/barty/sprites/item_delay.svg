<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Delay: stops a transit line for a round">
  <!-- A clock face with a bold red "banned" bar — the line is stopped, not
       merely being timed (that positive read is peptides.svg's teal badge). -->
  <circle cx="60" cy="60" r="44" fill="#f4ead8" stroke="#2b2015" stroke-width="6"/>
  <g fill="#2b2015">
    <rect x="56" y="18" width="8" height="10" rx="2"/>
    <rect x="56" y="92" width="8" height="10" rx="2"/>
    <rect x="18" y="56" width="10" height="8" rx="2"/>
    <rect x="92" y="56" width="10" height="8" rx="2"/>
  </g>
  <line x1="60" y1="60" x2="60" y2="34" stroke="#2b2015" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="80" y2="60" stroke="#2b2015" stroke-width="6" stroke-linecap="round"/>
  <line x1="27" y1="27" x2="93" y2="93" stroke="#2b2015" stroke-width="15" stroke-linecap="round"/>
  <line x1="27" y1="27" x2="93" y2="93" stroke="#b23a2e" stroke-width="9" stroke-linecap="round"/>
</svg>
