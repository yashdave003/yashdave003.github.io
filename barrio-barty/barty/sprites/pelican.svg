<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Brown pelican team token">
  <!-- grey-teal body, tail and neck -->
  <g fill="#549dbf" stroke="#549dbf" stroke-width="1" stroke-linejoin="round">
    <path d="M 84 60 A 44 44 0 0 1 116 50 L 96 80 Z"/>
    <circle cx="66" cy="76" r="27"/>
    <path d="M 30 40 L 54 36 L 72 74 L 40 86 Z"/>
  </g>
  <!-- folded wing, espresso arc lens -->
  <path d="M 50 70 A 30 30 0 0 1 92 68 A 36 36 0 0 1 50 70 Z" fill="#2b2015" stroke="#2b2015" stroke-width="1" stroke-linejoin="round"/>
  <!-- parchment head -->
  <circle cx="40" cy="38" r="17" fill="#f4ead8" stroke="#f4ead8" stroke-width="1"/>
  <!-- the beak: a long amber upper mandible, the pouch slung under it -->
  <path d="M 30 44 L 4 52 L 22 64 Z" fill="#2b2015" stroke="#2b2015" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 28 33 L 0 50 L 32 46 Z" fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="45" cy="34" r="4.4" fill="#2b2015"/>
  <!-- espresso feet -->
  <g fill="#2b2015" stroke="#2b2015" stroke-width="1">
    <rect x="56" y="100" width="5" height="11" rx="2"/><rect x="70" y="100" width="5" height="11" rx="2"/>
    <rect x="50" y="109" width="16" height="3.5" rx="1.75"/><rect x="64" y="109" width="16" height="3.5" rx="1.75"/>
  </g>
</svg>
