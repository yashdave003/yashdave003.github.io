  <rect x="25" y="34" width="70" height="16" fill="#1f4e8c" stroke="#2b2015" stroke-width="3"/>
  <circle cx="60" cy="88" r="9" fill="#f4ead8" stroke="#2b2015" stroke-width="4"/>
</svg>
