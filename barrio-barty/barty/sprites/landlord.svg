<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="The Landlord, a fat-cat mogul with the vault key">
  <!-- espresso suit body + arm reaching to the key -->
  <g fill="#2b2015" stroke="#2b2015" stroke-width="1" stroke-linejoin="round">
    <circle cx="54" cy="88" r="28"/>
  </g>
  <path d="M 76 82 A 16 16 0 0 0 92 72" fill="none" stroke="#2b2015" stroke-width="9" stroke-linecap="round"/>
  <!-- parchment shirt front (defines the chest on dark surfaces) -->
  <circle cx="54" cy="80" r="10.5" fill="#f4ead8" stroke="#f4ead8" stroke-width="1"/>
  <circle cx="54" cy="82" r="1.8" fill="#2b2015"/>
  <circle cx="54" cy="87.5" r="1.8" fill="#2b2015"/>
  <!-- amber cat head + ears -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round">
    <circle cx="36" cy="31" r="6"/>
    <circle cx="72" cy="31" r="6"/>
    <circle cx="54" cy="46" r="21"/>
  </g>
  <!-- top hat: crown + amber band + brim -->
  <g fill="#2b2015" stroke="#2b2015" stroke-width="1">
    <rect x="38" y="3" width="32" height="23"/>
    <rect x="28" y="24" width="52" height="7" rx="3.5"/>
  </g>
  <rect x="38" y="18" width="32" height="6" fill="#EF9F27"/>
  <!-- smug half-lidded eyes: lower half-discs -->
  <g fill="#2b2015">
    <path d="M 41 43 A 4.6 4.6 0 0 0 50.2 43 Z"/>
    <path d="M 58 43 A 4.6 4.6 0 0 0 67.2 43 Z"/>
  </g>
  <!-- muzzle, nose, curling grin -->
  <circle cx="54" cy="56" r="9" fill="#f4ead8" stroke="#f4ead8" stroke-width="1"/>
  <circle cx="54" cy="52" r="3" fill="#2b2015"/>
  <path d="M 47 59 A 9 9 0 0 0 63 57" fill="none" stroke="#2b2015" stroke-width="2.6" stroke-linecap="round"/>
  <!-- whiskers -->
  <g fill="none" stroke="#2b2015" stroke-width="1.6" stroke-linecap="round">
    <path d="M 43 54 L 29 51"/>
    <path d="M 43 57 L 30 59"/>
    <path d="M 65 54 L 79 51"/>
    <path d="M 65 57 L 78 59"/>
  </g>
  <!-- bowtie: two circles + knot -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1">
    <circle cx="47" cy="69" r="4.6"/>
    <circle cx="61" cy="69" r="4.6"/>
    <circle cx="54" cy="69" r="2.4"/>
  </g>
  <!-- the Alcatraz key, amber, held at the side -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round">
    <path d="M 88 58 a 8 8 0 1 0 16 0 a 8 8 0 1 0 -16 0 M 93 58 a 3 3 0 1 0 6 0 a 3 3 0 1 0 -6 0" fill-rule="evenodd"/>
    <rect x="93.5" y="65" width="5" height="30" rx="2"/>
    <rect x="98" y="82" width="7" height="4"/>
    <rect x="98" y="89" width="9" height="4"/>
  </g>
  <!-- espresso paw over the key stem -->
  <circle cx="96" cy="72" r="5.5" fill="#2b2015"/>
</svg>
