<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Waymo: instant ride to any station">
  <!-- White self-driving car, top-down, with its black roof sensor dome —
       ported from vehicleArt.ts's own waymo car body/dome proportions. -->
  <rect x="14" y="35" width="92" height="50" rx="20" fill="#f8f7f3" stroke="#2b2015" stroke-width="6"/>
  <!-- corner wheel bumps read as "car" from a top-down silhouette -->
  <g fill="#2b2015">
    <rect x="26" y="27" width="16" height="11" rx="4"/>
    <rect x="78" y="27" width="16" height="11" rx="4"/>
    <rect x="26" y="82" width="16" height="11" rx="4"/>
    <rect x="78" y="82" width="16" height="11" rx="4"/>
  </g>
  <!-- lidar sensor dome on the roof -->
  <circle cx="60" cy="60" r="16" fill="#1d1b19" stroke="#2b2015" stroke-width="3"/>
  <circle cx="60" cy="60" r="6" fill="#f8f7f3"/>
</svg>
