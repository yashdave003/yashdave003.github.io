    <path d="M 8 64 C 28 38 82 36 102 58 C 84 82 30 90 8 64 Z"/>
    <path d="M 50 46 L 60 18 L 76 46 Z"/>
    <path d="M 54 76 L 46 98 L 70 78 Z"/>
