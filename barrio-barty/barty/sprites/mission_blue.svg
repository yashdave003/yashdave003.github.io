<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mission blue butterfly team token">
  <!-- four blue wings, espresso-edged -->
  <g fill="#0099D8" stroke="#2b2015" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="38" cy="46" r="24"/>
    <circle cx="82" cy="46" r="24"/>
    <circle cx="42" cy="78" r="17"/>
    <circle cx="78" cy="78" r="17"/>
  </g>
  <!-- parchment fringe -->
  <g fill="none" stroke="#f4ead8" stroke-width="2.2">
    <circle cx="38" cy="46" r="20"/>
    <circle cx="82" cy="46" r="20"/>
    <circle cx="42" cy="78" r="13"/>
    <circle cx="78" cy="78" r="13"/>
  </g>
  <!-- the spots on the hindwings -->
  <g fill="#2b2015">
    <circle cx="36" cy="80" r="2.4"/><circle cx="46" cy="84" r="2"/><circle cx="84" cy="80" r="2.4"/><circle cx="74" cy="84" r="2"/>
  </g>
  <!-- body, head, antennae -->
  <rect x="56.5" y="40" width="7" height="50" rx="3.5" fill="#2b2015"/>
  <circle cx="60" cy="38" r="5" fill="#2b2015"/>
  <g fill="none" stroke="#2b2015" stroke-width="1.8" stroke-linecap="round">
    <path d="M 57 34 Q 48 22 42 18 M 63 34 Q 72 22 78 18"/>
  </g>
  <g fill="#2b2015"><circle cx="42" cy="18" r="2.4"/><circle cx="78" cy="18" r="2.4"/></g>
  <!-- eyes -->
  <g fill="#f4ead8"><circle cx="57.5" cy="37" r="1.6"/><circle cx="62.5" cy="37" r="1.6"/></g>
</svg>
