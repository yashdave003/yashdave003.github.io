<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Dungeness crab team token">
  <!-- red shell, claws and legs: circles + rounded stems, same-colour seams -->
  <g fill="#d40843" stroke="#d40843" stroke-width="1" stroke-linejoin="round">
    <!-- legs, three splayed stems a side -->
    <rect x="22" y="70" width="8" height="30" rx="4" transform="rotate(35 26 70)"/>
    <rect x="14" y="60" width="8" height="30" rx="4" transform="rotate(70 18 60)"/>
    <rect x="30" y="78" width="8" height="28" rx="4" transform="rotate(15 34 78)"/>
    <rect x="90" y="70" width="8" height="30" rx="4" transform="rotate(-35 94 70)"/>
    <rect x="98" y="60" width="8" height="30" rx="4" transform="rotate(-70 102 60)"/>
    <rect x="82" y="78" width="8" height="28" rx="4" transform="rotate(-15 86 78)"/>
    <!-- claw arms -->
    <rect x="22" y="48" width="12" height="22" rx="6" transform="rotate(30 28 59)"/>
    <rect x="86" y="48" width="12" height="22" rx="6" transform="rotate(-30 92 59)"/>
    <!-- claws -->
    <circle cx="18" cy="40" r="13"/>
    <circle cx="102" cy="40" r="13"/>
    <!-- carapace -->
    <circle cx="60" cy="68" r="28"/>
    <rect x="26" y="58" width="68" height="26" rx="13"/>
    <!-- eye stalks -->
    <rect x="48" y="36" width="5" height="14" rx="2.5"/>
    <rect x="67" y="36" width="5" height="14" rx="2.5"/>
  </g>
  <!-- open pincers: parchment notches -->
  <g fill="#f4ead8">
    <path d="M 5 33 L 20 40 L 5 47 Z"/>
    <path d="M 115 33 L 100 40 L 115 47 Z"/>
  </g>
  <!-- eyes -->
  <g fill="#f4ead8"><circle cx="50.5" cy="34" r="5.5"/><circle cx="69.5" cy="34" r="5.5"/></g>
  <g fill="#2b2015"><circle cx="51" cy="34" r="2.6"/><circle cx="70" cy="34" r="2.6"/></g>
  <!-- grin -->
  <path d="M 52 76 A 8 8 0 0 0 68 76" fill="none" stroke="#2b2015" stroke-width="2.6" stroke-linecap="round"/>
</svg>
