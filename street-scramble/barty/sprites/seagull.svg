<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="The Seagull, hungry star thief, perched">
  <!-- espresso rail perch -->
  <rect x="30" y="104" width="60" height="6" rx="3" fill="#2b2015" stroke="#2b2015" stroke-width="1"/>
  <!-- white body + head -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round">
    <circle cx="58" cy="64" r="26"/>
    <path d="M 24 40 L 48 34 L 62 62 L 34 74 Z"/>
    <circle cx="36" cy="40" r="15"/>
  </g>
  <!-- gray mantle wing + tail -->
  <g fill="#a9b2ba" stroke="#a9b2ba" stroke-width="1" stroke-linejoin="round">
    <path d="M 44 54 A 32 32 0 0 1 86 70 A 42 42 0 0 1 44 54 Z"/>
    <path d="M 78 58 L 112 50 L 92 76 Z"/>
  </g>
  <!-- amber beak with drooped hook tip -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round">
    <rect x="14" y="39" width="13" height="6.5" rx="2"/>
    <path d="M 21 39 A 7.5 7.5 0 0 0 13.5 51 L 21 45.5 Z"/>
  </g>
  <!-- hungry eye: angled espresso brow, amber iris, pinprick pupil -->
  <path d="M 25 29 L 43 34 L 26 37 Z" fill="#2b2015" stroke="#2b2015" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="33" cy="40" r="4.6" fill="#EF9F27"/>
  <circle cx="32" cy="41" r="1.8" fill="#2b2015"/>
  <!-- amber legs -->
  <g fill="#EF9F27" stroke="#EF9F27" stroke-width="1">
    <rect x="50" y="88" width="4.5" height="18" rx="2"/>
    <rect x="62" y="88" width="4.5" height="18" rx="2"/>
  </g>
</svg>
