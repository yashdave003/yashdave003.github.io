<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Coyote team token, howling">
  <!-- magenta body, sitting, muzzle to the sky -->
  <g fill="#D4537E" stroke="#D4537E" stroke-width="1" stroke-linejoin="round">
    <!-- haunch -->
    <circle cx="72" cy="88" r="24"/>
    <!-- chest -->
    <circle cx="52" cy="80" r="17"/>
    <!-- body connector -->
    <path d="M 40 76 L 66 68 L 86 90 L 46 98 Z"/>
    <!-- neck, leaning back -->
    <path d="M 42 46 L 58 38 L 64 74 L 42 80 Z"/>
    <!-- head -->
    <circle cx="48" cy="36" r="14"/>
    <!-- howling muzzle, wide wedge to upper-left -->
    <path d="M 34 24 L 12 8 L 48 40 Z"/>
    <!-- ears, wide and swept back -->
    <path d="M 50 26 L 67 5 L 61 33 Z"/>
    <path d="M 40 23 L 49 1 L 55 26 Z"/>
    <!-- front leg -->
    <rect x="44" y="88" width="9" height="24" rx="4"/>
  </g>
  <!-- tail: thick droopy arc stroke -->
  <path d="M 92 92 A 26 26 0 0 1 110 112" fill="none" stroke="#D4537E" stroke-width="12" stroke-linecap="round"/>
  <!-- parchment chest patch -->
  <circle cx="49" cy="82" r="7.5" fill="#f4ead8" stroke="#f4ead8" stroke-width="1"/>
  <!-- espresso details -->
  <g fill="#2b2015">
    <circle cx="15" cy="11" r="3.6"/>
    <circle cx="51" cy="30" r="3"/>
  </g>
</svg>
